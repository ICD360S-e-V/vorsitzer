# ───────────────────────────────────────────────────────────────
# Cache auf `main` vorwärmen — plus Android-Rauchprobe
#
# 🔴 Der Grund, warum es diesen Ablauf gibt: BIS HEUTE WAR JEDER CACHE IN
# DIESEM REPO REIN SCHREIBEND. Kein einziger Lauf konnte je einen fremden
# Cache lesen. Das ist keine Vermutung, das steht so in der GitHub-Doku:
#
#   „Workflow runs also cannot restore caches created for different tag
#    names. For example, a cache created for the tag `release-a` … would not
#    be accessible to a workflow run triggered for the tag `release-b`."
#
#   „When a cache is created by a workflow run triggered on a pull request,
#    the cache is created for the merge ref … the cache can only be restored
#    by re-runs of the pull request."
#
# Und genau so laufen unsere Abläufe:
#   • build.yml / build-android.yml / build-extras.yml  → Auslöser: Tag `v*`
#     ⇒ der Gradle-Cache von v6.120.7 ist für v6.120.8 unlesbar. Gemessen:
#       „Post setup-java" schreibt 52 s Cache, die nie wieder jemand liest.
#   • pr-checks.yml → Auslöser: nur `pull_request`
#     ⇒ an die merge-ref gebunden, für jeden ANDEREN PR unlesbar.
#   • release.yml → läuft zwar auf `main`, fasst aber weder Flutter noch
#     Gradle an und legt folglich gar keinen Cache an.
#
# Lesen dürfen alle Läufe nur den eigenen ref und den DEFAULT-BRANCH. Es gab
# aber niemanden, der auf `main` etwas hinterlegt. Dieser Ablauf ist dieser
# Jemand. Erst dadurch greifen `cache: true`, `cache: 'gradle'` und der
# apt-Cache in pr-checks.yml überhaupt — vorher waren sie Dekoration.
#
# ⚠️ Zweiter, unabhängiger Nutzen: hier wird zum ERSTEN MAL Android auf `main`
# gebaut. pr-checks.yml baut nur Linux, alles Android hängt am Tag — ein
# kaputter Android-Build fliegt heute also erst beim Release auf, wenn die
# Version schon vergeben und der Tag schon geschrieben ist. Debug reicht dafür:
# es geht um Auflösen und Übersetzen, nicht um die Signatur.
# ───────────────────────────────────────────────────────────────
name: Warm Cache

on:
  push:
    branches: [main]
  # Ein Cache-Eintrag, auf den sieben Tage lang niemand zugreift, wird von
  # GitHub verworfen. Bei der üblichen Taktung merkt man das nie — nach zwei
  # ruhigen Wochen aber wäre der erste Lauf wieder kalt. Der Wochenlauf hält
  # ihn am Leben, auch wenn nichts gemerged wird.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: warm-cache
  # ⚠️ AUSDRÜCKLICH false. Die erste Fassung stand hier auf `true` mit der
  # Begründung „der letzte Stand ist der einzige, der zählt" — das ist für
  # einen Cache-Wärmer falsch herum gedacht.
  #
  # Beobachtet am 19.08.2026: der Lauf von 10:51 wurde nach 218 Sekunden
  # abgebrochen, weil der nächste Merge kam. Ein Wärmer, der nie fertig wird,
  # legt auch nie etwas ab — und genau das war der Fall: auf `refs/heads/main`
  # lagen ausschliesslich CodeQL-Einträge, kein einziger aus diesem Ablauf.
  #
  # Ein etwas älterer Cache ist harmlos (die Schlüssel hängen an
  # pubspec.lock und der Flutter-Fassung, nicht am Commit). Gar kein Cache
  # ist es nicht.
  cancel-in-progress: false

permissions:
  contents: read
  # Für den Aufräumschritt am Ende — Caches löschen ist eine Schreiboperation.
  actions: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  warm:
    name: "🔥 Cache auf main vorwärmen"
    # Dasselbe Runner-Label wie in pr-checks.yml und build-android.yml.
    #
    # ⚠️ Nicht nur der Einheitlichkeit wegen: der Cache-Speicher hängt am
    # Anbieter. Solange die Jobs auf Blacksmith liefen, landeten die Einträge
    # in DEREN mitlaufendem Cache; nach der Rückkehr auf GitHub-Runner (#311)
    # waren sie unerreichbar, und der erste Lauf danach war wieder kalt.
    # Ein Wärmer, der auf einem anderen Anbieter läuft als die Verbraucher,
    # ist wieder genau das, was dieser Ablauf abschaffen soll: rein schreibend.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # ⚠️ Ab hier gilt für JEDEN Schritt: Aktion, Fassung und Schlüssel
      # müssen mit den verbrauchenden Abläufen übereinstimmen, sonst wärmt
      # dieser Lauf einen Cache vor, den niemand trifft. Beim Ändern einer
      # Fassung hier immer pr-checks.yml und build-android.yml mitziehen.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: 'temurin'
          # Dieselbe 21 wie in build-android.yml — edge_detection verlangt sie.
          java-version: '21'
          cache: 'gradle'

      # Identische Paketliste und identischer `version`-Schlüssel wie in
      # pr-checks.yml. Weicht eines davon ab, ist es ein anderer Cache.
      #
      # ⚠️ Deckel und Rückweg sind hier GENAUSO nötig wie in pr-checks.yml —
      # das war beim ersten Mal übersehen. Am 19.08.2026 um 11:32 blieb genau
      # dieser Schritt in „Warm Cache" stehen, ohne jede Begrenzung, und wäre
      # bis zum Job-Deckel von 45 Minuten gelaufen. Ausgerechnet hier tut das
      # doppelt weh: dieser Ablauf ist der EINZIGE, der auf `main` etwas
      # ablegt. Kommt er nicht durch, bleibt jeder PR und jeder Tag-Lauf kalt.
      - name: Install Linux build dependencies (cached)
        id: apt_cached
        # ⚠️ EINE Minute, nicht acht. Ein Treffer braucht gemessen 11 s. Wer
        # nach 60 s noch nicht fertig ist, installiert entweder von Grund auf
        # neu — das kann der Rueckweg unten besser, mit Spiegel-Timeout und
        # Wiederholungen — oder er haengt. In beiden Faellen ist Warten die
        # schlechteste Antwort. Acht Minuten waren hier zu grosszuegig.
        timeout-minutes: 1
        continue-on-error: true
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: >-
            clang cmake ninja-build pkg-config
            libgtk-3-dev liblzma-dev
            libmpv-dev mpv
            libayatana-appindicator3-dev
            libsecret-1-dev libjsoncpp-dev
            libcups2-dev libasound2-dev
          version: 1.0

      # Wortgleich mit dem Rückweg in pr-checks.yml — steigende Leine
      # 60/150/240 s, je Anlauf ein eigenes `timeout`, und ein
      # Spiegel-Timeout von 10 s, damit apt nicht unbegrenzt auf eine tote
      # Gegenstelle wartet.
      - name: Install Linux build dependencies (Rueckweg ohne Cache)
        if: steps.apt_cached.outcome != 'success'
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          echo "::warning::Der gecachte apt-Pfad war nicht erfolgreich" \
               "(Ergebnis: ${{ steps.apt_cached.outcome }}) — nehme den Rueckweg."

          # 🔴 ZUERST aufraeumen, sonst ist dieser Rueckweg chancenlos.
          #
          # Am 19.08.2026 scheiterten hier alle drei Anlaeufe in 38 Sekunden —
          # nicht am Netz, sondern an uns selbst:
          #
          #   E: Could not get lock /var/lib/dpkg/lock-frontend.
          #      It is held by process 2694 (apt-get)
          #
          # `timeout-minutes` beendet die AKTION, nicht deren Kindprozesse. Das
          # apt-get, das apt-fast gestartet hatte, lief weiter und hielt den
          # dpkg-Lock. Der Deckel stoppt apt also nicht, er verwaist es — und
          # macht aus einem langsamen Lauf einen roten PR.
          #
          # Erst freundlich, dann hart, dann die Reste; `dpkg --configure -a`
          # raeumt halb entpackte Pakete auf, die ein Abschuss mitten im
          # Installieren hinterlaesst.
          echo "── raeume verwaiste apt-Prozesse und Sperren weg ──"
          sudo pkill -TERM -f 'apt-fast|apt-get|unattended-upgr' 2>/dev/null || true
          sleep 3
          sudo pkill -KILL -f 'apt-fast|apt-get|unattended-upgr' 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
                     /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
          sudo dpkg --configure -a 2>&1 | tail -3 || true
          PAKETE="clang cmake ninja-build pkg-config
                  libgtk-3-dev liblzma-dev
                  libmpv-dev mpv
                  libayatana-appindicator3-dev
                  libsecret-1-dev libjsoncpp-dev
                  libcups2-dev libasound2-dev"
          APT_ZEIT="-o Acquire::http::Timeout=10
                    -o Acquire::https::Timeout=10
                    -o Acquire::ftp::Timeout=10
                    -o Acquire::Retries=3"
          i=0
          for LEINE in 60 150 240; do
            i=$((i + 1))
            echo "── Anlauf $i von 3, Leine ${LEINE}s ──"
            if timeout "$LEINE" sudo -E apt-get $APT_ZEIT update -qq \
               && timeout "$LEINE" sudo -E apt-get $APT_ZEIT install -y --no-install-recommends $PAKETE; then
              echo "Pakete installiert im Anlauf $i (Leine ${LEINE}s)."
              exit 0
            fi
            echo "Anlauf $i fehlgeschlagen oder nach ${LEINE}s abgelaufen."
            [ "$i" -lt 3 ] && sleep 15
          done
          echo "::error::Drei Anlaeufe gescheitert — vermutlich ein apt-Spiegel," \
               "der nicht antwortet. Das liegt nicht am Code auf main."
          exit 1

      - name: flutter pub get
        run: flutter pub get

      # Füllt in einem Zug den Gradle-Abhängigkeits-Cache, den Kotlin-Cache und
      # die Android-Artefakte von Flutter — also genau das, was der
      # Release-Build auf dem Tag später kalt herunterladen müsste.
      #
      # Über retry-build.sh, weil `pdfium_dart` seine native Bibliothek in
      # hook/build.dart per package:http von GitHub zieht: genau daran starb
      # v6.101.1, ohne jeden Codefehler.
      - name: Android-Debug-Build (wärmt Gradle + dient als Rauchprobe)
        run: .github/scripts/retry-build.sh flutter build apk --debug

      # ───────────────────────────────────────────────────────────────
      # 🔴 Ohne diesen Schritt nützt das Vorwärmen oben GAR NICHTS.
      #
      # Gemessen am 19.08.2026 waren 9,99 GB von 10 GB Cache-Kontingent
      # belegt — und 8,35 GB davon lagen auf TAG-Refs:
      #
      #   4,21 GB  refs/tags/v6.120.14   (4 Einträge)
      #   4,14 GB  refs/tags/v6.120.10   (6 Einträge)
      #   0,18 GB  refs/heads/main       (15 Einträge, alle von CodeQL)
      #
      # Ein auf einem Tag angelegter Cache ist für JEDEN künftigen Lauf
      # unlesbar — auch für den nächsten Tag. Diese Einträge werden also
      # geschrieben und nie wieder angefasst. Schlimmer: sobald das
      # Kontingent voll ist, räumt GitHub nach Zugriffsalter ab, und
      # verdrängt damit ausgerechnet den einen Scope, den alle lesen dürfen.
      # Genau deshalb lag hier kein einziger vorgewärmter Eintrag.
      #
      # Die Tag-Abläufe legen bei jedem Release rund 4 GB davon an; sie
      # lassen sich nicht abstellen, weil setup-java und flutter-action ihr
      # Caching selbst mitbringen. Also wird hinterher aufgeräumt.
      #
      # ⚠️ Nur TAG-Refs. Caches offener Pull Requests bleiben unangetastet —
      # die sind für Wiederholungsläufe desselben PR sehr wohl lesbar.
      - name: Tote Tag-Caches wegräumen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MB_GESAMT=0
          ANZAHL=0
          while read -r ID GROESSE REF; do
            [ -z "$ID" ] && continue
            MB=$(( GROESSE / 1048576 ))
            if gh api -X DELETE "repos/${GH_REPO}/actions/caches/${ID}" >/dev/null 2>&1; then
              echo "  entfernt: ${MB} MB  ${REF}"
              MB_GESAMT=$(( MB_GESAMT + MB )); ANZAHL=$(( ANZAHL + 1 ))
            fi
          done < <(gh api "repos/${GH_REPO}/actions/caches" --paginate \
                     --jq '.actions_caches[] | select(.ref | test("refs/tags/")) | "\(.id) \(.size_in_bytes) \(.ref)"')
          echo "── ${ANZAHL} tote Einträge, ${MB_GESAMT} MB freigegeben ──"

      - name: Was jetzt auf main liegt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Vorgewärmt für Flutter ${FLUTTER_VERSION}:"
          echo "  • Flutter-SDK        (subosito/flutter-action)"
          echo "  • apt-Pakete         (cache-apt-pkgs-action, Schlüssel 1.0)"
          echo "  • pub-Cache          (flutter pub get)"
          echo "  • Gradle + Kotlin    (setup-java, cache: gradle)"
          echo
          echo "Lesbar ab jetzt von jedem PR und von jedem Tag-Lauf."
          echo
          echo "Belegung nach dem Aufräumen:"
          gh api "repos/${GH_REPO}/actions/caches" --paginate \
            --jq '.actions_caches[] | "\(.ref)\t\(.size_in_bytes)"' \
            | awk -F'\t' '{s[$1]+=$2} END {for (k in s) printf "  %7.2f GB  %s\n", s[k]/1073741824, k}' \
            | sort -rn
