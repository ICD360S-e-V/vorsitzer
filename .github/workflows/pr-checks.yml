# ───────────────────────────────────────────────────────────────
# Bis jetzt hat auf einem Pull Request nichts kompiliert. Von den bestehenden
# Abläufen hängt einzig security-scans.yml an `pull_request`, und der fasst
# Flutter nicht an; alles andere läuft erst auf einem Tag, also nach dem Merge.
# Die grünen Haken auf einem PR bedeuteten damit "keine verwundbare
# Abhängigkeit, kein geleaktes Geheimnis" — nicht "lässt sich bauen".
#
# Dieser Ablauf schliesst genau diese Lücke: analysieren, bauen, testen, bevor
# gemerged wird.
# ───────────────────────────────────────────────────────────────
name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Ein neuer Push auf denselben PR macht den vorherigen Lauf wertlos.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  verify:
    name: "🔍 Analyse, Build & Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Dieselbe Liste wie im Linux-Job in build.yml. Sie wird hier gebraucht,
      # weil weiter unten wirklich für Linux gebaut wird — siehe die Begründung
      # beim Testschritt.
      #
      # ⚠️ Gemessen war dieser Schritt mit 299 s der TEUERSTE des ganzen Laufs —
      # 45 % von 11 Minuten, und davon kein einziges Byte Rechenarbeit. Die
      # Aktion legt die Paketdateien in den Actions-Cache und stellt sie beim
      # nächsten Lauf wieder her; sie setzt intern selbst
      # DEBIAN_FRONTEND=noninteractive, die needrestart-Falle aus build.yml
      # ist also weiterhin abgedeckt.
      #
      # ⚠️ Der Cache greift nur, weil warm-cache.yml denselben Schlüssel auf
      # `main` befüllt: ein auf einem PR erzeugter Cache ist an dessen
      # merge-ref gebunden und für JEDEN anderen PR unlesbar.
      # ⚠️ Zeitdeckel AM SCHRITT, nicht nur am Job. Am 19.08.2026 stand dieser
      # Schritt auf PR #302 zweiundzwanzig Minuten still — ohne eine Zeile
      # Ausgabe, ohne Fehler: ein apt-Spiegel antwortete schlicht nicht. Am
      # Job-Deckel (45 min) steht danach nur „zu lang", nicht WAS hing; am
      # Schritt sieht man es sofort, und der Wiederholungslauf beginnt in
      # derselben Minute statt nach einer Dreiviertelstunde.
      #
      # Gemessen dauert der Schritt 11 s aus dem Cache und ~40 s ohne. Acht
      # Minuten sind also das Zwanzigfache des schlechtesten gesunden Laufs —
      # weit genug weg, um nie versehentlich zu greifen.
      #
      # ⚠️ Ein Cache-Fehltreffer ist nach einem Runner-Wechsel garantiert:
      # solange die Jobs auf Blacksmith liefen, landeten die Eintraege in
      # DEREN mitlaufendem Cache. Auf GitHub-Runnern sind sie unerreichbar,
      # bis warm-cache.yml nach dem Merge einmal auf `main` durchgelaufen ist.
      # Das ist ein einmaliger Uebergang, kein Dauerzustand.
      - name: Install Linux build dependencies (cached)
        id: apt_cached
        # ⚠️ EINE Minute, nicht acht. Ein Treffer braucht gemessen 11 s. Wer
        # nach 60 s noch nicht fertig ist, installiert entweder von Grund auf
        # neu — das kann der Rueckweg unten besser, mit Spiegel-Timeout und
        # Wiederholungen — oder er haengt. In beiden Faellen ist Warten die
        # schlechteste Antwort. Acht Minuten waren hier zu grosszuegig.
        timeout-minutes: 1
        continue-on-error: true
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: >-
            clang cmake ninja-build pkg-config
            libgtk-3-dev liblzma-dev
            libmpv-dev mpv
            libayatana-appindicator3-dev
            libsecret-1-dev libjsoncpp-dev
            libcups2-dev libasound2-dev
          version: 1.0

      # Rueckweg, wenn der schnelle Pfad haengt oder scheitert. Er ist bewusst
      # das LANGWEILIGERE Werkzeug:
      #
      # ⚠️ Die Cache-Aktion benutzt intern `apt-fast`, das sie sich erst von
      # raw.githubusercontent.com holt und das mit vielen parallelen
      # Verbindungen laedt. Genau daran blieb der Lauf am 19.08.2026 haengen
      # („Clean installing 13 packages..." ohne weitere Ausgabe). Der
      # Rueckweg nimmt schlichtes apt-get: eine Abhaengigkeit weniger, ein
      # Netzweg weniger, und ein Spiegel, der throttelt, trifft ihn nicht
      # genauso.
      #
      # ⚠️ JEDER Anlauf braucht sein EIGENES `timeout`. Ohne das verbraucht
      # der erste die ganze Zeit und die Wiederholung kommt nie zum Zug —
      # derselbe Fehler, vor dem auch die Zweigstelle
      # ci/apt-haengt-nicht-mehr-stundenlang warnt.
      - name: Install Linux build dependencies (Rueckweg ohne Cache)
        if: steps.apt_cached.outcome != 'success'
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          echo "::warning::Der gecachte apt-Pfad war nicht erfolgreich" \
               "(Ergebnis: ${{ steps.apt_cached.outcome }}) — nehme den Rueckweg."

          # 🔴 ZUERST aufraeumen, sonst ist dieser Rueckweg chancenlos.
          #
          # Am 19.08.2026 scheiterten hier alle drei Anlaeufe in 38 Sekunden —
          # nicht am Netz, sondern an uns selbst:
          #
          #   E: Could not get lock /var/lib/dpkg/lock-frontend.
          #      It is held by process 2694 (apt-get)
          #
          # `timeout-minutes` beendet die AKTION, nicht deren Kindprozesse. Das
          # apt-get, das apt-fast gestartet hatte, lief weiter und hielt den
          # dpkg-Lock. Der Deckel stoppt apt also nicht, er verwaist es — und
          # macht aus einem langsamen Lauf einen roten PR.
          #
          # Erst freundlich, dann hart, dann die Reste; `dpkg --configure -a`
          # raeumt halb entpackte Pakete auf, die ein Abschuss mitten im
          # Installieren hinterlaesst.
          echo "── raeume verwaiste apt-Prozesse und Sperren weg ──"
          sudo pkill -TERM -f 'apt-fast|apt-get|unattended-upgr' 2>/dev/null || true
          sleep 3
          sudo pkill -KILL -f 'apt-fast|apt-get|unattended-upgr' 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
                     /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
          sudo dpkg --configure -a 2>&1 | tail -3 || true
          PAKETE="clang cmake ninja-build pkg-config
                  libgtk-3-dev liblzma-dev
                  libmpv-dev mpv
                  libayatana-appindicator3-dev
                  libsecret-1-dev libjsoncpp-dev
                  libcups2-dev libasound2-dev"
          # ⚠️ Die 10 Sekunden gehoeren HIERHIN, nicht auf den ganzen Schritt.
          # Ein Gesamtdeckel von 10 s wuerde jeden Lauf abwuergen — eine
          # gesunde Installation dieser 13 Pakete dauert gemessen ~40 s. Was
          # wir abstellen wollen, ist etwas anderes: apt wartet ohne diese
          # Einstellung UNBEGRENZT auf einen Spiegel, der nicht antwortet.
          # Genau so entstand das Bild vom 19.08.2026 — minutenlang keine
          # einzige Zeile Ausgabe.
          #
          # Mit Timeout=10 gibt apt einen toten Spiegel nach zehn Sekunden auf
          # und versucht es selbst noch dreimal (Acquire::Retries). Der Fehler
          # faellt damit in Sekunden auf statt in Minuten, und der aeussere
          # `timeout` bleibt nur noch das letzte Netz.
          APT_ZEIT="-o Acquire::http::Timeout=10
                    -o Acquire::https::Timeout=10
                    -o Acquire::ftp::Timeout=10
                    -o Acquire::Retries=3"
          # ⚠️ Steigende Leine statt einer festen: 60 s, dann 150 s, dann 240 s.
          #
          # Der erste Anlauf bekommt bewusst wenig Zeit — ein haengender
          # Spiegel zeigt sich in den ersten Sekunden, und dann ist Abbrechen
          # und Neuversuchen schneller als Warten. Ein Anlauf, der nur LANGSAM
          # ist, braucht dagegen Luft: derselbe Schritt hat auf einem
          # GitHub-Runner gemessen 299 s gedauert. Eine feste Leine von 60 s
          # wuerde also jeden gesunden Kaltstart abwuergen, eine von 240 s
          # jeden Haenger dreimal voll auslaufen lassen.
          LEINEN="60 150 240"
          i=0
          for LEINE in $LEINEN; do
            i=$((i + 1))
            echo "── Anlauf $i von 3, Leine ${LEINE}s ──"
            if timeout "$LEINE" sudo -E apt-get $APT_ZEIT update -qq \
               && timeout "$LEINE" sudo -E apt-get $APT_ZEIT install -y --no-install-recommends $PAKETE; then
              echo "Pakete installiert im Anlauf $i (Leine ${LEINE}s)."
              exit 0
            fi
            echo "Anlauf $i fehlgeschlagen oder nach ${LEINE}s abgelaufen."
            [ "$i" -lt 3 ] && sleep 15
          done
          echo "::error::Drei Anlaeufe gescheitert — vermutlich ein apt-Spiegel," \
               "der nicht antwortet. Das liegt nicht am Code dieses PRs."
          exit 1

      - name: flutter pub get
        run: flutter pub get

      # Gleiche Schalter wie in den bestehenden Abläufen: Fehler halten an,
      # Warnungen und Infos nicht. Sonst würde die absichtlich geparkte
      # unused_element-Warnung jeden PR rot färben.
      - name: flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # Der Build ist hier kein Selbstzweck. Er ist der einzige Weg an
      # libdartcv.so zu kommen, und ohne die schlagen acht Tests fehl, weil
      # dartcv4 die Bibliothek zur Laufzeit nachlädt. Nebenbei ist es damit
      # überhaupt das erste Mal, dass ein PR kompiliert wird.
      # ⚠️ Über retry-build.sh, wie jeder andere Build im Projekt. Dieser eine
      # Schritt lief als einziger ohne Wiederholung — und er greift ins Netz:
      # `flutter_webrtc` lädt beim CMake-Lauf libwebrtc-linux-x64-release.zip
      # von release-assets.githubusercontent.com. Am 27.08.2026 hat GitHub die
      # Verbindung im TLS-Handshake zurückgesetzt:
      #
      #     Recv failure: Connection reset by peer
      #     OpenSSL SSL_connect: Connection reset by peer
      #     Unable to generate build files
      #
      # Ein PR fiel damit rot aus, ohne dass am Code etwas war. Das Muster
      # `Connection reset` steht längst in retry-build.sh — es wurde hier nur
      # nie benutzt.
      # ⚠️ Der Schlüssel haengt an der dartcv4-Fassung UND am Dart-SDK, nicht an
      # `pubspec.lock`: der Bau wird nur ungueltig, wenn eines von beiden sich
      # aendert. Auf die Sperrdatei zu hashen hiesse, den 9-Minuten-Bau bei
      # JEDER Abhaengigkeitsaenderung wegzuwerfen — also fast bei jedem PR,
      # der ihn braucht.
      - name: Schluessel fuer den nativen dartcv-Bau bestimmen
        id: dartcv
        run: |
          set -euo pipefail
          V="$(awk '/^  dartcv4:/{f=1} f && /^    version:/{gsub(/[" ]/,"",$2); print $2; exit}' pubspec.lock)"
          if [ -z "$V" ]; then
            echo "::error::dartcv4 steht nicht in pubspec.lock — Schluessel waere leer."
            exit 1
          fi
          D="$(dart --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "key=dartcv-${{ runner.os }}-$V-dart$D" >> "$GITHUB_OUTPUT"
          echo "dartcv4 $V, Dart $D"

      # ⚠️ NUR WIEDERHERSTELLEN, nicht schreiben. Ein Cache, den ein PR anlegt,
      # ist an dessen merge-ref gebunden und fuer jeden anderen PR unlesbar
      # (siehe die Begruendung im Kopf von warm-cache.yml) — er wuerde also
      # ~500 MB kosten und niemandem nuetzen, ausser einem erneuten Lauf
      # DIESES PRs. Geschrieben wird ausschliesslich auf `main`.
      #
      # Was er spart: seit `dartcv4` 2.2 gibt es kein vorgebautes OpenCV mehr,
      # es wird aus der Quelle uebersetzt. Gemessen an PR #548 hat das diesen
      # Ablauf von ~8m30s auf 17m16s gebracht.
      - name: Nativen dartcv-Bau wiederherstellen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .dart_tool/hooks_runner
          key: ${{ steps.dartcv.outputs.key }}
          restore-keys: dartcv-${{ runner.os }}-${{ steps.dartcv.outputs.version }}-

      - name: Build Linux (liefert libdartcv.so für die Tests)
        run: .github/scripts/retry-build.sh flutter build linux --debug

      - name: flutter test
        run: |
          set -euo pipefail
          # Pfad suchen statt raten: der Ordner unter build/linux hängt an
          # Architektur und Modus, und beides kann sich ändern.
          DARTCV_SO="$(find build/linux -name 'libdartcv.so' -print -quit)"
          if [ -z "$DARTCV_SO" ]; then
            echo "::error::libdartcv.so nach dem Linux-Build nicht gefunden —" \
                 "ohne sie scheitern die OpenCV-Tests an einem Ladefehler."
            exit 1
          fi
          echo "libdartcv.so: $DARTCV_SO"
          DARTCV_LIB_PATH="$PWD/$DARTCV_SO" flutter test --reporter=compact
