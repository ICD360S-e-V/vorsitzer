# ───────────────────────────────────────────────────────────────
# Bis jetzt hat auf einem Pull Request nichts kompiliert. Von den bestehenden
# Abläufen hängt einzig security-scans.yml an `pull_request`, und der fasst
# Flutter nicht an; alles andere läuft erst auf einem Tag, also nach dem Merge.
# Die grünen Haken auf einem PR bedeuteten damit "keine verwundbare
# Abhängigkeit, kein geleaktes Geheimnis" — nicht "lässt sich bauen".
#
# Dieser Ablauf schliesst genau diese Lücke: analysieren, bauen, testen, bevor
# gemerged wird.
# ───────────────────────────────────────────────────────────────
name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Ein neuer Push auf denselben PR macht den vorherigen Lauf wertlos.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  verify:
    name: "🔍 Analyse, Build & Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Dieselbe Liste wie im Linux-Job in build.yml. Sie wird hier gebraucht,
      # weil weiter unten wirklich für Linux gebaut wird — siehe die Begründung
      # beim Testschritt.
      #
      # ⚠️ Gemessen war dieser Schritt mit 299 s der TEUERSTE des ganzen Laufs —
      # 45 % von 11 Minuten, und davon kein einziges Byte Rechenarbeit. Die
      # Aktion legt die Paketdateien in den Actions-Cache und stellt sie beim
      # nächsten Lauf wieder her; sie setzt intern selbst
      # DEBIAN_FRONTEND=noninteractive, die needrestart-Falle aus build.yml
      # ist also weiterhin abgedeckt.
      #
      # ⚠️ Der Cache greift nur, weil warm-cache.yml denselben Schlüssel auf
      # `main` befüllt: ein auf einem PR erzeugter Cache ist an dessen
      # merge-ref gebunden und für JEDEN anderen PR unlesbar.
      # ⚠️ Zeitdeckel AM SCHRITT, nicht nur am Job. Am 19.08.2026 stand dieser
      # Schritt auf PR #302 zweiundzwanzig Minuten still — ohne eine Zeile
      # Ausgabe, ohne Fehler: ein apt-Spiegel antwortete schlicht nicht. Am
      # Job-Deckel (45 min) steht danach nur „zu lang", nicht WAS hing; am
      # Schritt sieht man es sofort, und der Wiederholungslauf beginnt in
      # derselben Minute statt nach einer Dreiviertelstunde.
      #
      # Gemessen dauert der Schritt 11 s aus dem Cache und ~40 s ohne. Acht
      # Minuten sind also das Zwanzigfache des schlechtesten gesunden Laufs —
      # weit genug weg, um nie versehentlich zu greifen.
      #
      # ⚠️ Ein Cache-Fehltreffer ist nach einem Runner-Wechsel garantiert:
      # solange die Jobs auf Blacksmith liefen, landeten die Eintraege in
      # DEREN mitlaufendem Cache. Auf GitHub-Runnern sind sie unerreichbar,
      # bis warm-cache.yml nach dem Merge einmal auf `main` durchgelaufen ist.
      # Das ist ein einmaliger Uebergang, kein Dauerzustand.
      - name: Install Linux build dependencies (cached)
        id: apt_cached
        timeout-minutes: 8
        continue-on-error: true
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: >-
            clang cmake ninja-build pkg-config
            libgtk-3-dev liblzma-dev
            libmpv-dev mpv
            libayatana-appindicator3-dev
            libsecret-1-dev libjsoncpp-dev
            libcups2-dev libasound2-dev
          version: 1.0

      # Rueckweg, wenn der schnelle Pfad haengt oder scheitert. Er ist bewusst
      # das LANGWEILIGERE Werkzeug:
      #
      # ⚠️ Die Cache-Aktion benutzt intern `apt-fast`, das sie sich erst von
      # raw.githubusercontent.com holt und das mit vielen parallelen
      # Verbindungen laedt. Genau daran blieb der Lauf am 19.08.2026 haengen
      # („Clean installing 13 packages..." ohne weitere Ausgabe). Der
      # Rueckweg nimmt schlichtes apt-get: eine Abhaengigkeit weniger, ein
      # Netzweg weniger, und ein Spiegel, der throttelt, trifft ihn nicht
      # genauso.
      #
      # ⚠️ JEDER Anlauf braucht sein EIGENES `timeout`. Ohne das verbraucht
      # der erste die ganze Zeit und die Wiederholung kommt nie zum Zug —
      # derselbe Fehler, vor dem auch die Zweigstelle
      # ci/apt-haengt-nicht-mehr-stundenlang warnt.
      - name: Install Linux build dependencies (Rueckweg ohne Cache)
        if: steps.apt_cached.outcome != 'success'
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          echo "::warning::Der gecachte apt-Pfad war nicht erfolgreich" \
               "(Ergebnis: ${{ steps.apt_cached.outcome }}) — nehme den Rueckweg."
          PAKETE="clang cmake ninja-build pkg-config
                  libgtk-3-dev liblzma-dev
                  libmpv-dev mpv
                  libayatana-appindicator3-dev
                  libsecret-1-dev libjsoncpp-dev
                  libcups2-dev libasound2-dev"
          for i in 1 2 3; do
            echo "── Anlauf $i von 3 ──"
            if timeout 200 sudo -E apt-get update -qq \
               && timeout 200 sudo -E apt-get install -y --no-install-recommends $PAKETE; then
              echo "Pakete installiert im Anlauf $i."
              exit 0
            fi
            echo "Anlauf $i fehlgeschlagen oder abgelaufen."
            [ "$i" -lt 3 ] && sleep 15
          done
          echo "::error::Drei Anlaeufe gescheitert — vermutlich ein apt-Spiegel," \
               "der nicht antwortet. Das liegt nicht am Code dieses PRs."
          exit 1

      - name: flutter pub get
        run: flutter pub get

      # Gleiche Schalter wie in den bestehenden Abläufen: Fehler halten an,
      # Warnungen und Infos nicht. Sonst würde die absichtlich geparkte
      # unused_element-Warnung jeden PR rot färben.
      - name: flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # Der Build ist hier kein Selbstzweck. Er ist der einzige Weg an
      # libdartcv.so zu kommen, und ohne die schlagen acht Tests fehl, weil
      # dartcv4 die Bibliothek zur Laufzeit nachlädt. Nebenbei ist es damit
      # überhaupt das erste Mal, dass ein PR kompiliert wird.
      - name: Build Linux (liefert libdartcv.so für die Tests)
        run: flutter build linux --debug

      - name: flutter test
        run: |
          set -euo pipefail
          # Pfad suchen statt raten: der Ordner unter build/linux hängt an
          # Architektur und Modus, und beides kann sich ändern.
          DARTCV_SO="$(find build/linux -name 'libdartcv.so' -print -quit)"
          if [ -z "$DARTCV_SO" ]; then
            echo "::error::libdartcv.so nach dem Linux-Build nicht gefunden —" \
                 "ohne sie scheitern die OpenCV-Tests an einem Ladefehler."
            exit 1
          fi
          echo "libdartcv.so: $DARTCV_SO"
          DARTCV_LIB_PATH="$PWD/$DARTCV_SO" flutter test --reporter=compact
