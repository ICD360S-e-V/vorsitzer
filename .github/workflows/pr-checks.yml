# ───────────────────────────────────────────────────────────────
# Bis jetzt hat auf einem Pull Request nichts kompiliert. Von den bestehenden
# Abläufen hängt einzig security-scans.yml an `pull_request`, und der fasst
# Flutter nicht an; alles andere läuft erst auf einem Tag, also nach dem Merge.
# Die grünen Haken auf einem PR bedeuteten damit "keine verwundbare
# Abhängigkeit, kein geleaktes Geheimnis" — nicht "lässt sich bauen".
#
# Dieser Ablauf schliesst genau diese Lücke: analysieren, bauen, testen, bevor
# gemerged wird.
# ───────────────────────────────────────────────────────────────
name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Ein neuer Push auf denselben PR macht den vorherigen Lauf wertlos.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  verify:
    name: "🔍 Analyse, Build & Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Dieselbe Liste wie im Linux-Job in build.yml. Sie wird hier gebraucht,
      # weil weiter unten wirklich für Linux gebaut wird — siehe die Begründung
      # beim Testschritt.
      - name: Install Linux build dependencies
        # Cloud runners ship none of the desktop toolchain. clang/cmake/ninja +
        # GTK are what `flutter build linux` itself needs; the rest are plugin
        # requirements: libmpv (media_kit), appindicator (tray_manager),
        # libsecret (flutter_secure_storage), cups (printing), alsa (audio).
        #
        # ⚠️ WARUM HIER EIN ZEITLIMIT UND EIN WIEDERHOLVERSUCH STEHEN
        # Am 19.08.2026 hing dieser Schritt beim Release v6.120.7 **18 Minuten**
        # in `apt-get`, während derselbe Schritt eine Stunde zuvor 366 s
        # gebraucht hatte. Der Runner war nicht tot — Checkout und Flutter-SDK
        # liefen in Sekunden; nur der Ubuntu-Spiegel antwortete nicht mehr.
        #
        # Ohne Limit ist das kein Fehlschlag, sondern ein Stillstand: apt wartet
        # weiter, der Schritt bleibt „in Arbeit", und erst das 6-Stunden-Limit
        # von GitHub beendet den Auftrag. Ein Build, der hängt, ist schlimmer
        # als einer, der scheitert — beim Fehlschlag weiß man es sofort.
        #
        # ⚠️ `.github/scripts/retry-build.sh` greift hier NICHT: der wiederholt
        # bei Fehlermeldungen von Gradle/Maven und package:http. apt ist hier
        # aber gar nicht gescheitert, sondern stehen geblieben — dafür braucht
        # es ein Zeitlimit, keine Mustererkennung.
        timeout-minutes: 18
        env:
          # Ubuntu 24.04 pulls in needrestart, which without a noninteractive
          # frontend opens a service-restart prompt mid-install and hangs the
          # step forever (no TTY to answer it). Force apt fully non-interactive.
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -u
          # Eigene Zeitschranke je Versuch. `timeout-minutes` oben deckt den
          # ganzen Schritt ab und würde beim ersten Hänger zuschlagen, bevor
          # ein zweiter Versuch überhaupt beginnt — deshalb hier zusätzlich
          # `timeout` pro Aufruf: 3 × höchstens 5 min statt 1 × unbegrenzt.
          #
          # Acquire::Retries lässt apt einzelne Downloads selbst wiederholen;
          # die Timeouts sorgen dafür, dass ein stummer Spiegel nach 20 s
          # aufgegeben wird, statt die Verbindung offen zu halten.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          PAKETE="clang cmake ninja-build pkg-config
                  libgtk-3-dev liblzma-dev
                  libmpv-dev mpv
                  libayatana-appindicator3-dev
                  libsecret-1-dev libjsoncpp-dev
                  libcups2-dev libasound2-dev"

          for versuch in 1 2 3; do
            echo "::group::apt-Versuch $versuch von 3"
            if timeout 300 sudo apt-get $APT_OPTS update \
               && timeout 300 sudo apt-get $APT_OPTS install -y --no-install-recommends $PAKETE; then
              echo "::endgroup::"
              echo "Systempakete installiert (Versuch $versuch)."
              exit 0
            fi
            echo "::endgroup::"
            # ⚠️ Als Warnung, nicht als Fehler: ein misslungener Versuch, dem
            # ein geglückter folgt, darf den Auftrag nicht rot färben — sonst
            # sieht ein erfolgreicher Build aus wie ein kaputter.
            echo "::warning::apt-Versuch $versuch fehlgeschlagen oder nach 5 min abgebrochen — neuer Versuch in 20 s"
            sleep 20
          done

          echo "::error::apt ist dreimal gescheitert. Das ist fast immer der Ubuntu-Spiegel, nicht dieses Projekt — der Auftrag lässt sich unverändert erneut starten."
          exit 1

      - name: flutter pub get
        run: flutter pub get

      # Gleiche Schalter wie in den bestehenden Abläufen: Fehler halten an,
      # Warnungen und Infos nicht. Sonst würde die absichtlich geparkte
      # unused_element-Warnung jeden PR rot färben.
      - name: flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # Der Build ist hier kein Selbstzweck. Er ist der einzige Weg an
      # libdartcv.so zu kommen, und ohne die schlagen acht Tests fehl, weil
      # dartcv4 die Bibliothek zur Laufzeit nachlädt. Nebenbei ist es damit
      # überhaupt das erste Mal, dass ein PR kompiliert wird.
      - name: Build Linux (liefert libdartcv.so für die Tests)
        run: flutter build linux --debug

      - name: flutter test
        run: |
          set -euo pipefail
          # Pfad suchen statt raten: der Ordner unter build/linux hängt an
          # Architektur und Modus, und beides kann sich ändern.
          DARTCV_SO="$(find build/linux -name 'libdartcv.so' -print -quit)"
          if [ -z "$DARTCV_SO" ]; then
            echo "::error::libdartcv.so nach dem Linux-Build nicht gefunden —" \
                 "ohne sie scheitern die OpenCV-Tests an einem Ladefehler."
            exit 1
          fi
          echo "libdartcv.so: $DARTCV_SO"
          DARTCV_LIB_PATH="$PWD/$DARTCV_SO" flutter test --reporter=compact
