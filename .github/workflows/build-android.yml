name: Build Android (priority)

# ───────────────────────────────────────────────────────────────
# PRIORITY WORKFLOW — Android Universal APK (fast)
#
# Mirror image of build.yml (Linux + Flatpak). Runs on GitHub-hosted
# runners — `ubuntu-latest`, 4 vCPU / 16 GB for a public repository.
#
# ⚠️ BEWUSST GitHub, nicht Blacksmith. Am 19.08.2026 lief beides, und die
# Entscheidung fiel gegen den Anbieter — nicht wegen der Runner, die lagen
# mit 158 von 3.000 Freiminuten glatt in der Gratismenge, sondern weil mit
# derselben App `[code]smith` mitkam: ein getrennt abgerechnetes
# KI-Review zu 1,75 $ je Recheneinheit, ohne Freikontingent, das an einem
# Tag rund 15 $ erzeugte. Auf einem OEFFENTLICHEN Repo sind GitHub-Runner
# kostenlos und unbegrenzt, es gibt also gar keine Rechnung, auf der so
# etwas erscheinen koennte. Das ist der Punkt, nicht der Preis.
#
# Gemessen kostet das rund 2 Minuten je Build. Der grosse Teil der
# Beschleunigung von heute haengt ohnehin nicht am Runner: arm64-only,
# warm-cache.yml und das entkoppelte `analyze`.
#
# ⚠️ Wer den Blacksmith-Migrationsassistenten erneut laufen laesst, setzt
# alle 24 `runs-on` still wieder um — ein Kommentar haelt ihn nicht auf.
# Sicher wird es nur durch Deinstallieren der GitHub-App.
#
# ⚠️ Der frueher hier beschriebene selbstgehostete Runner auf 10.10.10.60
# existiert nicht mehr; `gh api .../actions/runners` liefert eine leere
# Liste. Hier ist nichts vorinstalliert — setup-java und flutter-action
# holen alles, und die Caches greifen nur, weil warm-cache.yml sie auf
# `main` hinterlegt.
#
# On every `git push` of a tag like vX.Y.Z+N, this workflow:
#   1. Reads version + build_number from pubspec.yaml.
#   2. Builds the signed Universal APK.
#   3. Uploads the APK to the matching GitHub Release as
#      `vorsitzer.apk` (stable filename → `releases/latest/download/`
#      resolves to it automatically) AND as `vorsitzer-VERSION.apk`
#      for a permanent versioned link.
#   4. Patches the icd360sev `version_vorsitzer.json` so the
#      in-app update check returns the new build number + GitHub
#      release URL — Android clients auto-detect and download.
#
# Why a GitHub Release URL instead of icd360sev for Android?
# The owner wants Android updates served straight from GitHub so
# bandwidth/CDN comes from there and the APK is independent of the
# internal infra. The version_vorsitzer.json on icd360sev still
# drives the in-app "is there an update?" probe — only the
# `download_url_android` field flips to the GitHub URL.
# ───────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: false
        default: '3.44.8'
      build_number:
        description: 'Build number override (leave empty for auto)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

env:
  APP_NAME: vorsitzer

# Read-only by default. Only the publish job needs `contents: write`
# to upload the APK to a GitHub Release.
permissions:
  contents: read

# Single concurrency lane across ALL refs. When a newer tag arrives while
# an older Android build is still running/queued, the older one is cancelled —
# only the latest version's APK ships to GitHub Release + server JSON.
concurrency:
  group: vorsitzer-android
  cancel-in-progress: true

# ============================================================
# SECRETS REQUIRED:
# ============================================================
# Android signing:
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS
#
# Runtime dart-defines (must match build.yml exactly):
#   TURN_HOST (TURN creds are now ephemeral — fetched at runtime via api/auth/turn_credentials.php)
#   HAFAS_AID
#   ROUTINE_AES_KEY_V2
#   VORSITZER_STARTUP_DIAG_KEY
#
# Server JSON update (icd360sev):
#   DEPLOY_HOST / DEPLOY_PORT / DEPLOY_USER / DEPLOY_SSH_KEY
# ============================================================

jobs:
  # ──────────────────────────────────────────────
  # Determine version info from pubspec.yaml
  # ──────────────────────────────────────────────
  version:
    name: "📋 Version Info"
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Extract version from pubspec.yaml
        id: version
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep '^version:' pubspec.yaml)
          VERSION_NAME=$(echo "$VERSION_LINE" | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER_DEFAULT=$(echo "$VERSION_LINE" | sed 's/version: //' | cut -d'+' -f2)
          BUILD_NUMBER="${INPUT_BUILD_NUMBER:-$BUILD_NUMBER_DEFAULT}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION_NAME+$BUILD_NUMBER"

  # ──────────────────────────────────────────────
  # Static analysis — run BEFORE the APK build so we fail in ~30s
  # instead of wasting 10+ min on a build whose artifact would be
  # thrown away. Mirror of the analyze job in build.yml but on
  # ubuntu-latest (Android-side runs on cloud since 3d8932f0).
  # ──────────────────────────────────────────────
  analyze:
    name: "🔍 Static analysis"
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.44.8' }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        # Same tolerance as build.yml — errors fail the build, warnings
        # and infos are accepted until the Radio→RadioGroup migration is
        # finished and the residual unused private fields are cleaned up.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  # ──────────────────────────────────────────────
  # Android Universal APK (fat APK, all ABIs)
  # ──────────────────────────────────────────────
  android-universal:
    name: "🤖 Android Universal APK"
    # Only `version` — NOT `analyze`. Measured on a real run, the analyze job
    # took 139 s during which this job sat idle, although the same analysis
    # already ran on the pull request via pr-checks.yml.
    #
    # The guard is not lost, it moved: `publish-release` now waits for
    # `analyze`. So the APK compiles in parallel with the analysis, but
    # nothing is published unless the analysis is green.
    needs: version
    # NOTE: the self-hosted runner on 10.10.10.60 that older comments here
    # referred to no longer exists — `gh api .../actions/runners` returns an
    # empty list and every job in this repo runs cloud-hosted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: 'temurin'
          # JDK 21: the edge_detection plugin (Dokument-Scanner) declares Java 21,
          # which fails on JDK 17 with "invalid source release: 21". JDK 21 builds
          # both the plugin (21) and the app (Java 17 target) fine.
          java-version: '21'
          cache: 'gradle'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.44.8' }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/app/upload-keystore.jks android/key.properties

      - name: Build Universal APK
        env:
          TURN_HOST: ${{ secrets.TURN_HOST }}
          HAFAS_AID: ${{ secrets.HAFAS_AID }}
          ROUTINE_AES_KEY_V2: ${{ secrets.ROUTINE_AES_KEY_V2 }}
          STARTUP_DIAG_KEY: ${{ secrets.VORSITZER_STARTUP_DIAG_KEY }}
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          set -euo pipefail
          # ⚠️ --target-platform android-arm64: NUR 64-Bit-ARM, keine drei
          # Architekturen mehr. Gemessen am APK von v6.120.10 (276,1 MB):
          #
          #   lib/x86_64        102,3 MB   nur Emulatoren
          #   lib/arm64-v8a      90,7 MB   echte Geraete
          #   lib/armeabi-v7a    78,0 MB   32-Bit-Android
          #   ───────────────────────────
          #                     271,0 MB = 98 % des APK
          #   alle Assets zusammen 1,6 MB
          #
          # Es war also nie eine vergessene Datei, sondern schlicht dreimal
          # dasselbe. Entscheidung des Users (19.08.2026): 32 Bit faellt weg,
          # alle Geraete laufen auf Android 14/15/16 und aufwaerts. Erwartet
          # ~93 MB statt 276 MB, und statt drei laeuft nur noch EIN
          # gen_snapshot — der Build wird dadurch ebenfalls kuerzer.
          #
          # ⚠️ flutter#169413 behauptet, --target-platform werde ohne
          # --split-per-abi ignoriert. Auf unserer Fassung 3.44.8 stimmt das
          # NICHT: nachgeprueft mit einem leeren Projekt, das APK enthielt
          # danach ausschliesslich lib/arm64-v8a. Deckt sich mit der Quelle,
          # build_apk.dart:74 reicht die Liste durch und gradle.dart:526
          # setzt daraus -Ptarget-platform. Der Schritt unten prueft es
          # trotzdem bei JEDEM Build nach — falls eine kuenftige
          # Flutter-Fassung doch der Fehlermeldung folgt, faellt das sofort
          # auf, statt still ein 276-MB-APK auszuliefern.
          .github/scripts/retry-build.sh flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=TURN_HOST="$TURN_HOST" \
            --dart-define=HAFAS_AID="$HAFAS_AID" \
            --dart-define=ROUTINE_AES_KEY_V2="$ROUTINE_AES_KEY_V2" \
            --dart-define=STARTUP_DIAG_KEY="$STARTUP_DIAG_KEY" \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER"

      # Ohne diese Pruefung waeren beide Fehlerrichtungen unsichtbar: ein APK,
      # das wieder alle drei Architekturen enthaelt (dann waere die Ersparnis
      # weg), und schlimmer, eines ganz OHNE arm64 (das liesse sich auf keinem
      # Geraet des Vereins installieren, und auffallen wuerde es erst beim
      # Mitglied).
      - name: Nachweis — das APK enthaelt genau arm64-v8a
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          # ⚠️ `unzip -Z1` listet nur die Eintragsnamen. Die erste Fassung nahm
          # `unzip -l` und griff mit `lib/[^/]+` hinein — das passte auch auf
          # `…/packages/<paket>/lib/assets/…` und meldete deshalb eine
          # "Architektur" namens `assets`. Der Anker `^lib/` und der
          # abschliessende Schraegstrich lassen nur die echte Ebene durch.
          ABIS="$(unzip -Z1 "$APK" | grep -oE '^lib/[^/]+/' | sed 's|^lib/||;s|/$||' | sort -u)"
          GROESSE="$(du -h "$APK" | cut -f1)"
          echo "Architekturen im APK: ${ABIS:-(keine)}"
          echo "Groesse: $GROESSE"
          if [ "$ABIS" != "arm64-v8a" ]; then
            # Mehrzeilige Werte wuerden die ::error::-Zeile abschneiden, darum
            # zuerst lesbar ins Protokoll und erst dann einzeilig als Fehler.
            echo "--- gefundene Architekturen ---"
            printf '%s\n' "$ABIS"
            echo "-------------------------------"
            echo "::error::Erwartet genau arm64-v8a, gefunden: $(printf '%s' "$ABIS" | tr '\n' ' ')— pruefe --target-platform und ndk.abiFilters in android/app/build.gradle.kts"
            exit 1
          fi

      - name: Stage APKs (stable + versioned names)
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # The update_service.dart in the app uses Platform.isAndroid to pick
          # `download_url_android` and then downloads "icd360sev_vorsitzer.apk"
          # by its content, so the filename on GitHub doesn't have to match
          # that. We ship two names for convenience:
          #   - vorsitzer.apk           → stable, resolves via
          #     releases/latest/download/vorsitzer.apk
          #   - vorsitzer-X.Y.Z.apk     → permanent versioned link
          cp build/app/outputs/flutter-apk/app-release.apk dist/${APP_NAME}.apk
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/${APP_NAME}-${VERSION_NAME}.apk
          ls -lh dist/

      - name: Cleanup keystore from workspace
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          # Pure intra-run transport: a later job downloads this and
          # attaches it to the Release, which is where it belongs long term.
          retention-days: 1
          name: android-universal-apk
          path: dist/*.apk

  # ──────────────────────────────────────────────
  # Publish APK to the GitHub Release for this tag
  # ──────────────────────────────────────────────
  publish-release:
    name: "🚀 Publish to GitHub Release"
    # `analyze` is listed here, not on android-universal: the build may start
    # immediately, but publishing still requires a green analysis.
    needs: [version, analyze, android-universal]
    if: startsWith(github.ref, 'refs/tags/v')
    # GitHub-hosted: `gh` CLI is preinstalled here but NOT on our self-hosted
    # Linux runner. This job only downloads the APK artifact and uploads it
    # to the Release — no Flutter / Android SDK needed.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: android-universal-apk
          path: dist

      - name: Ensure release exists (build.yml usually creates it first)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # This step used to poll `gh release view` six times with sleep 30.
          # Measured on the last successful run it burned 182 s ≈ 6 × 30 s,
          # i.e. it exhausted every retry and then created the release itself:
          # the fallback WAS the normal path, and the waiting never once paid
          # off. So: check, create, and only re-check if creation lost a race
          # against build.yml (which runs in parallel and may create it too).
          if gh release view "$GH_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $GH_REF_NAME already exists."
            exit 0
          fi
          if gh release create "$GH_REF_NAME" \
            --repo "$GH_REPO" \
            --generate-notes \
            --title "$GH_REF_NAME"; then
            echo "Release $GH_REF_NAME created."
            exit 0
          fi
          # Creation failed. By far the likeliest reason is that build.yml
          # created the release between our check and our create, so a SHORT
          # re-check is justified here — unlike the old unconditional wait.
          echo "Create failed, re-checking whether build.yml won the race..."
          for i in 1 2 3; do
            sleep 5
            if gh release view "$GH_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
              echo "Release $GH_REF_NAME exists (created by the other workflow)."
              exit 0
            fi
          done
          echo "::error::Release $GH_REF_NAME neither exists nor could be created."
          exit 1

      - name: Upload APKs to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$GH_REF_NAME" dist/*.apk --clobber --repo "$GH_REPO"
          echo "✅ APK uploaded. Stable URL:"
          echo "    https://github.com/$GH_REPO/releases/latest/download/${APP_NAME}.apk"

      # ────────────────────────────────────────────
      # Publish version_vorsitzer.json directly as a Release asset.
      # App fetches it from `releases/latest/download/version_vorsitzer.json`
      # — no SSH to internal server, no Device Key auth, runs entirely on
      # cloud. Replaces the old SSH→icd360sev update-version-json job.
      # ────────────────────────────────────────────
      - name: Generate + upload version_vorsitzer.json to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version_name }}
          BUILD: ${{ needs.version.outputs.build_number }}
        run: |
          set -euo pipefail
          export GH_URL="https://github.com/${GH_REPO}/releases/download/${GH_REF_NAME}/vorsitzer.apk"
          # ⚠️ macOS und Windows werden NICHT MEHR GEBAUT (Entscheidung des
          # Users, 19.08.2026: vorsitzer laeuft nur noch auf Android und Linux;
          # die drei Jobs in build-extras.yml stehen auf `if: false`).
          #
          # Die beiden Schluessel bleiben trotzdem stehen, und sie zeigen fest
          # auf LETZTE_DESKTOP_VERSION statt auf die laufende Version. Grund
          # steht im alten Kommentar und gilt unveraendert: faellt
          # `download_url_macos` weg, greift der Client auf `download_url`
          # zurueck, laedt das 276-MB-APK, legt es als .dmg ab, und hdiutil
          # meldet "disk image corrupt". Ein Verweis auf die letzte echte DMG
          # ist harmlos; ein fehlender Schluessel ist es nicht.
          #
          # Bei Windows waere das Weglassen zwar folgenlos (die
          # Endungspruefung in update_service.dart bietet dann gar nichts an) —
          # der Einheitlichkeit halber wird es genauso behandelt.
          #
          # Wenn die Desktop-Builds je zurueckkehren: diese Konstante loeschen
          # und wieder ${GH_REF_NAME} einsetzen.
          LETZTE_DESKTOP_VERSION="v6.120.10"
          LETZTE_DESKTOP_NUMMER="6.120.10"
          export GH_URL_MACOS="https://github.com/${GH_REPO}/releases/download/${LETZTE_DESKTOP_VERSION}/vorsitzer-${LETZTE_DESKTOP_NUMMER}-macos.dmg"
          export GH_URL_WINDOWS="https://github.com/${GH_REPO}/releases/download/${LETZTE_DESKTOP_VERSION}/vorsitzer-${LETZTE_DESKTOP_NUMMER}-windows-x64.zip"
          export RELEASE_DATE="$(date -u +%Y-%m-%d)"
          # Python-generated to JSON-encode all untrusted values safely.
          # Wrapped in {"success": true, ...} so the app code reads it the
          # same way as the old icd360sev PHP response — no client change
          # needed beyond swapping versionUrl.
          python3 - <<'PY' > version_vorsitzer.json
          import json, os
          json.dump({
              'success':              True,
              'version':              os.environ['VERSION'],
              'build_number':         int(os.environ['BUILD']),
              'download_url_android': os.environ['GH_URL'],
              'download_url_macos':   os.environ['GH_URL_MACOS'],
              'download_url_windows': os.environ['GH_URL_WINDOWS'],
              'download_url':         os.environ['GH_URL'],
              'release_date':         os.environ['RELEASE_DATE'],
              'changelog':            (
                  f"Version {os.environ['VERSION']}\n\n"
                  f"See full changelog at "
                  f"https://github.com/{os.environ['GH_REPO']}/releases/tag/{os.environ['GH_REF_NAME']}"
              ),
          }, open('/dev/stdout', 'w'), indent=2)
          PY
          gh release upload "$GH_REF_NAME" version_vorsitzer.json --clobber --repo "$GH_REPO"
          echo "✅ version_vorsitzer.json uploaded. Stable URL:"
          echo "    https://github.com/$GH_REPO/releases/latest/download/version_vorsitzer.json"
