group 'de.icd360sev.icd_anruf'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'de.icd360sev.icd_anruf'
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Wie die App (WebRTC verlangt 24).
        minSdkVersion 24
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    // NotificationCompat: der Rückfallweg legt eine Benachrichtigung, und die
    // muss von Android 7 bis 16 gleich aussehen.
    implementation 'androidx.core:core-ktx:1.13.1'
}
