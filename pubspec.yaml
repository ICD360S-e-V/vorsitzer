name: icd360sev_vorsitzer
description: "ICD360S e.V - Vorsitzer Portal"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 6.178.11+1853

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Flutter localizations for German date/time pickers
  flutter_localizations:
    sdk: flutter

  # HTTP requests
  http: ^1.2.0

  # OSM-based map for the Radar tab in WeatherDialog. Combined with RainViewer
  # tile overlay for animated precipitation history + short-term forecast.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # SHA-256 for live document-content hash compare in Stufe 6/7/8 Beweis dialog.
  crypto: ^3.0.0

  # ASN.1 — den SubjectPublicKeyInfo aus dem Serverzertifikat ziehen
  # (spki_pin.dart). Kam bisher nur transitiv herein; hier deklariert,
  # damit der Import stabil ist — wie bei flutter_svg.
  asn1lib: ^1.5.0

  # AccumulatorSink — SHA-256 mitlaufend beim Herunterladen eines Updates
  # bilden, statt ein 100-MB-APK noch einmal komplett einzulesen.
  # Kam bisher nur transitiv ueber `crypto` herein; hier deklariert,
  # damit der Import stabil ist — wie bei flutter_svg.
  convert: ^3.1.1

  # HTML parsing for client-side handelsregister.de scraping
  # Exakt gepinnt: der Sanitizer und flutter_widget_from_html_core müssen
  # DENSELBEN html5lib-Port benutzen. Die mXSS-Bypässe bei DOMPurify, Proton
  # und Tuta entstanden alle daraus, dass Sanitizer und Renderer
  # unterschiedlich geparst haben.
  html: 0.15.6

  # Local storage for tokens
  shared_preferences: ^2.5.5

  # State management
  provider: ^6.1.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9

  # ============================================================
  # CROSS-PLATFORM PACKAGES (work on all platforms)
  # ============================================================

  # Secure storage - encrypted credentials
  # Windows: DPAPI, macOS: Keychain, Linux: libsecret, Android: Keystore, iOS: Keychain
  flutter_secure_storage: ^10.0.0

  # Pure-Dart D-Bus client. Used by SecureStore to ask the session bus whether
  # org.freedesktop.secrets actually has an owner BEFORE entering the Linux
  # secure-storage plugin, whose libsecret calls are synchronous and freeze the
  # Flutter platform thread for the full 25 s D-Bus activation timeout when it
  # does not. Already present transitively (file_picker, connectivity_plus);
  # named here because we now depend on it directly.
  dbus: ^0.7.13

  # WebSocket for real-time chat
  web_socket_channel: ^3.0.1

  # WebRTC for voice/video calls (works on all platforms)
  flutter_webrtc: ^1.5.2

  # SIP-Stack für sipgate (SIP over WebSocket gegen wss://sip.sipgate.de).
  # Nutzt flutter_webrtc für die Sprache, kann also nur DTLS-SRTP — was
  # sipgate laut Messung vom 11.08.2026 auch anbietet (UDP/TLS/RTP/SAVPF,
  # a=fingerprint, opus/48000/2). UDP-Signalisierung kennt das Paket nicht,
  # brauchen wir hier auch nicht.
  sip_ua: ^1.1.0

  # Path provider for temp directory
  path_provider: ^2.1.0
  # Direkt referenziert für die Temp-Umleitung auf Linux (privater_temp.dart):
  # getTemporaryDirectory() -> privates 0700-Cache statt world-readable /tmp.
  path_provider_linux: ^2.2.2
  path_provider_platform_interface: ^2.1.3

  # Pfadarithmetik für sicherer_dateiname.dart (kanonisieren + isWithin).
  # Kam bisher nur transitiv herein; hier deklariert, damit der Import
  # stabil ist — wie bei flutter_svg.
  path: ^1.9.0

  # Bilder aus der Systemzwischenablage (Strg+V im Chat). Flutters eigenes
  # Clipboard kann nur Text — flutter#46418. Reines Plattform-C/ObjC/Kotlin,
  # keine zusätzliche Toolchain (super_clipboard bräuchte Rust + NDK).
  pasteboard: ^0.5.0

  # Device info for unique device identification
  # Pinned to 12.x: 13.x requires win32_registry ^3.0.3 which conflicts with launch_at_startup ^0.5.1
  device_info_plus: ^12.4.0

  # UUID generation for device ID
  uuid: ^4.5.3


  # AES-256-GCM (pure Dart, no native plugin — works in Flatpak sandbox).
  # Used by StartupDiagnostics to encrypt the startup transcript before
  # POSTing it to /api/logs/vorsitzer_*.php. `encrypt: ^5.0.3` doesn't
  # ship GCM, only CBC — so a second package is unavoidable here.
  cryptography: ^2.7.0

  # Date formatting and week number calculation
  intl: ^0.20.2

  # File picker for chat attachments
  file_picker: ^11.0.3

  # macOS file picker alternative — no entitlement check, works without sandbox
  # Used by FilePickerHelper on macOS to bypass file_picker's entitlement block
  file_selector: ^1.0.3

  # Image picker for camera capture (mobile)
  image_picker: ^1.2.2

  # In-app camera preview (mobile) — used by the Secure Cloud "Foto aufnehmen"
  # so capture stays IN our Activity (no external app → Android can't kill our
  # process mid-camera and lose the photo / the unlocked cloud session).
  camera: ^0.12.0

  # Native macOS camera capture (AVFoundation)
  camera_macos: ^0.1.0

  # Image cropping (pure Dart, works on all platforms including macOS)
  crop_your_image: ^2.0.0

  # Handwritten signature capture (pure Dart, cross-platform)
  signature: ^6.3.0

  # SVG render (parent consent signature preview in _SignatureDialog).
  # Already pulled in transitively, declared here so the import is stable.
  flutter_svg: ^2.0.10

  # Barcode rendering (pure Dart, no native plugin — works on Android + Flatpak).
  # Generates a scannable barcode from a Kundenkarten-Code in the Karten tab.
  # Symbology is selectable per card (Code128 default; EAN-13/EAN-8/Code39/ITF/QR).
  # NB: EAN is a GS1 product-numbering standard, NOT the same as a generic
  # loyalty-card barcode — so Code128 is the default, EAN only when the card is EAN.
  barcode_widget: ^2.0.4

  # URL launcher for opening downloaded files
  url_launcher: ^6.2.0

  # Open file with default app
  open_filex: ^4.5.0

  # Android APK installer (self-update)
  android_package_installer: ^0.0.3

  # PDF generation for Zuwendungsbestätigung (Spendequittung)
  pdf: ^3.12.0

  # PDF printing/sharing/saving
  printing: ^5.14.3

  # Image processing for PDF compression (JPEG encoding with quality control)
  image: ^4.8.0

  # Geolocation for GPS position (transit nearby stops)
  geolocator: ^14.0.2

  # Audio player for live radio streaming (macOS: AVFoundation)
  just_audio: ^0.10.5

  # Ringtone (callee) / ringback (caller) during a voice/video call. Uses the
  # system ringtone — no bundled audio asset needed.
  flutter_ringtone_player: ^4.0.0

  # Battery level monitoring for diagnostics
  battery_plus: ^7.0.0

  # Cross-platform notifications (replaces local_notifier)
  flutter_local_notifications: ^22.2.0

  # Text-to-speech for the "Sprich Wetter"-Button im Aktuell-Tab (a11y).
  # Uses the OS TTS engine on each platform, no cloud calls.
  flutter_tts: ^4.2.0


  # ============================================================
  # DESKTOP-ONLY PACKAGES (Windows, macOS, Linux)
  # ============================================================

  # Single instance - prevent multiple app windows (Windows only for now)
  windows_single_instance: ^1.0.1

  # WebView for Windows (WebView2)
  webview_windows: ^0.4.0

  # Linux uses ExternalBrowserService (drives the host Chromium-Flatpak via
  # CDP) — webview_cef was pulled out: even pinned to master 68c245f the
  # plugin loaded libcef.so eagerly at startup and the app exited within ~3s
  # because CEF couldn't locate its resource pak / chrome-sandbox inside the
  # freedesktop-Platform sandbox. See lib/services/external_browser_service.
  #
  # WebView for mobile (Android/iOS)
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.18.0

  # Window manager - control window size, position, maximize (desktop only)
  window_manager: ^0.5.1

  # Zweites Fenster für den Blitz — die kleine Nachrichten-Karte, die mitten
  # auf dem Bildschirm über jedem anderen Programm auftaucht.
  #
  # ⚠️ Flutter 3.44.8 hat Mehrfenster bereits eingebaut (WindowingOwner,
  # _window_linux.dart), aber NICHT öffentlich exportiert — der eigene
  # Doc-Kommentar verlangt `import 'package:flutter/src/widgets/_window.dart'`,
  # also SDK-Interna ohne Stabilitätszusage. Sobald Canonical das öffentlich
  # macht, fliegt dieses Paket wieder raus.
  desktop_multi_window: ^0.3.0

  # System tray - minimize to tray, background running (desktop only)
  tray_manager: ^0.5.0

  # Auto-start with OS login (desktop only)
  launch_at_startup: ^0.5.1

  # Windows taskbar - flash icon and show badge (Windows only)
  windows_taskbar: ^1.1.2

  # ============================================================
  # MOBILE-ONLY PACKAGES (Android, iOS)
  # ============================================================

  # Background tasks scheduler (mobile alternative to auto-start)
  workmanager: ^0.9.0

  # Vordergrunddienst für das Gateway-Tablet.
  #
  # WorkManager reicht für Termin-Erinnerungen (ein Tag Vorlauf), aber nicht
  # für die TAN der digitalen Unterschrift: die gilt fünf Minuten, und Android
  # lässt periodische Jobs frühestens alle 15 Minuten laufen. Ohne einen
  # laufenden Dienst käme der Code bei geschlossener App immer zu spät.
  #
  # Ein Firebase-Push wäre die übliche Antwort — den gibt es hier bewusst
  # nicht: die App wird über das eigene F-Droid-Repo verteilt, ohne Play
  # Services. Genau denselben Weg geht auch die F-Droid-Fassung von ntfy
  # selbst (dauerhafte Verbindung statt FCM, ~0-1 % Akku in 17 Stunden).
  flutter_foreground_task: ^10.0.0

  # SMS-Versand über die SIM des Vereins-Tablets (Termin-Erinnerungen).
  # Eigenes Plugin-Paket statt MethodChannel in MainActivity: nur registrierte
  # Plugins sind auch in der Engine da, die WorkManager im Hintergrund startet.
  icd_sms:
    path: packages/icd_sms

  # Netz-Momentaufnahme für den Speedtest (Mobilfunkgeneration, Signal, Zelle).
  # Eigenes Paket, weil der WorkManager-Isolat nur registrierte Plugins sieht —
  # dieselbe Begründung wie bei icd_sms, siehe dessen pubspec.
  icd_netinfo:
    path: packages/icd_netinfo

  # Ferngesteuerter Anruf: geklickt am Rechner, gewählt auf dem Telefon mit der
  # SIM. Eigenes Paket aus derselben Begründung wie icd_sms — der Auftrag kommt
  # im Vordergrunddienst an, und dessen Engine kennt nur registrierte Plugins.
  icd_anruf:
    path: packages/icd_anruf
  pdfrx: ^2.2.24
  archive: ^4.0.9

  # TOTP/HOTP RFC 6238 — generate 2FA codes for stored platform secrets
  # Pinned to 3.1.3: otp >=3.2.0 needs timezone ^0.10.0 which conflicts
  # with flutter_local_notifications 21.0.0 (needs timezone ^0.11.0)
  otp: 3.1.3
  just_audio_media_kit: ^2.1.0
  # dart:ffi-Hilfen (malloc/Utf8) für mpv_locale_fix.dart — libmpv verlangt
  # LC_NUMERIC=C, sonst abort() beim ersten AudioPlayer.
  ffi: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9

  # Chrome DevTools Protocol — drive an external Chromium process for the
  # Linux/Flatpak "Antrag Online" auto-fill flow. webview_cef is WIP and
  # unstable inside the freedesktop sandbox; instead we spawn the host
  # Chromium Flatpak with --remote-debugging-port=9222, connect over the
  # CDP WebSocket, and inject the same auto-fill JS we used in CEF.
  # 3.19.x is the last release compatible with Dart SDK ^3.6.1; 3.20+
  # bumps to 3.9.
  puppeteer: ^3.19.0

  # Voice command input pentru ÖPNV Verbindung-suche. Utilizează platform-
  # native speech recognizer (Android SpeechRecognizer / iOS Speech.framework).
  # Zero network calls, funcționează și offline pe device-uri cu on-device STT.
  speech_to_text: ^7.0.0
  opencv_core: ^1.4.5
  flutter_widget_from_html_core: ^0.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Nur für test/standort_strom_test.dart: der Test setzt eine
  # Ersatz-GeolocatorPlatform ein, um zu belegen, dass der Positionsstrom bei
  # einer feineren Anforderung wirklich neu aufgebaut wird. Beide Pakete kommen
  # ohnehin über `geolocator` mit; hier stehen sie, damit sie nicht als
  # `depend_on_referenced_packages` in der Analyse auftauchen.
  # Nur für test/visitenkarte_pdf_test.dart: der Test rechnet die Modulzahl des
  # QR-Codes nach, damit niemand den MECARD so weit auffüllt, dass der Code auf
  # Normalpapier nicht mehr lesbar ist. Das Paket kommt ohnehin über `pdf` mit;
  # hier steht es, damit es nicht als `depend_on_referenced_packages` in der
  # Analyse auftaucht.
  barcode: ^2.2.9
  geolocator_platform_interface: ^4.2.6
  plugin_platform_interface: ^2.1.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets for system tray icon and badges
  assets:
    - assets/app_icon.ico
    - assets/sounds/
    - assets/badges/
    - assets/flaggen/
    - assets/ikonen/
    - assets/tray_icons/
    - assets/card_logos/
    - assets/fonts/
    - assets/woerterbuch/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
